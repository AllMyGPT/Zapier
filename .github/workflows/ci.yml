name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  typecheck-lint:
    name: Type check & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emotiv-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: emotiv-sync/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint . --max-warnings 0
