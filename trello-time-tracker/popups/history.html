<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historial de tiempo</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 12px 16px;
      background: #fff;
      color: #172b4d;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #5e6c84;
      font-size: 14px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .total-badge {
      background: #e9f2ff;
      color: #0052cc;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #5e6c84;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .empty {
      text-align: center;
      padding: 24px 16px;
      color: #97a0af;
      font-size: 14px;
    }

    .entry-list {
      list-style: none;
    }

    .entry-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #f4f5f7;
    }

    .entry-item:last-child {
      border-bottom: none;
    }

    .entry-icon {
      font-size: 16px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .entry-body {
      flex: 1;
      min-width: 0;
    }

    .entry-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .entry-hours {
      font-size: 14px;
      font-weight: 700;
      color: #172b4d;
      white-space: nowrap;
    }

    .entry-date {
      font-size: 12px;
      color: #5e6c84;
      white-space: nowrap;
    }

    .entry-desc {
      font-size: 12px;
      color: #5e6c84;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .entry-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-timer {
      background: #ffebe6;
      color: #bf2600;
    }

    .badge-manual {
      background: #e3fcef;
      color: #006644;
    }

    .badge-billable {
      background: #e9f2ff;
      color: #0052cc;
    }

    .badge-running {
      background: #ff5630;
      color: #fff;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .entry-user {
      font-size: 11px;
      color: #97a0af;
    }

    .error {
      background: #ffebe6;
      color: #bf2600;
      border: 1px solid #ff8f73;
      border-radius: 3px;
      padding: 8px 10px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading-state">Cargando historial...</div>
  <div id="main-content" style="display:none">
    <div class="header">
      <span class="section-title">Entradas de tiempo</span>
      <span class="total-badge" id="total-hours">⏱ 0h</span>
    </div>
    <div id="entries-container"></div>
  </div>

  <script type="module" src="/popups/history.ts"></script>
</body>
</html>
